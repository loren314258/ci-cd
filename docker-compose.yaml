version: '3.8'

services:
  # Container 1: EntryTracker App (Flask)
  entrytracker-app:
    # שימוש ב-Image מתוך ה-AWS ECR במקום בנייה מקומית
    image: 010594764177.dkr.ecr.ap-south-1.amazonaws.com/entry-tracker:latest
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db-mysql
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=app_db
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db-mysql

  # Container 2: MySQL Database
  db-mysql:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=app_db
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend-net

networks:
  # רשת לתקשורת חיצונית
  frontend-net:
    driver: bridge
  # רשת מבודדת לתקשורת פנימית מול ה-DB
  backend-net:
    driver: bridge

volumes:
  # שמירת נתוני בסיס הנתונים
  db-data: