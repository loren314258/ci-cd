name: EntryTracker CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run E2E Environment
        run: |
          docker compose up -d --build
          sleep 40

      - name: Run E2E Test (curl)
        run: |
          curl -v http://localhost:5000/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: entry-tracker
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # --- שלב ה-DEPLOY המעודכן ---
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. התחברות ל-ECR מתוך השרת עם sudo כדי שאישור הכניסה יישמר ב-root
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 010594764177.dkr.ecr.ap-south-1.amazonaws.com
            
            # 2. משיכת ה-Image החדש עם sudo (פותר את שגיאת ה-no basic auth)
            sudo docker compose pull
            
            # 3. רענון הקונטיינרים - החלפת הגרסה הישנה בחדשה
            sudo docker compose up -d --remove-orphans
            
            # 4. ניקוי Images ישנים שתופסים מקום בשרת
            sudo docker image prune -f

      - name: Cleanup
        if: always()
        run: docker compose down