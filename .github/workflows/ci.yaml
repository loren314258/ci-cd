name: EntryTracker CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

  steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # שימוש ב-docker compose (בלי מקף)
      - name: Build and Run E2E Environment
        run: |
          docker compose up -d --build
          sleep 30 

      - name: Run E2E Test (curl)
        run: |
          curl -v http://localhost:5000/

      - name: View Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down