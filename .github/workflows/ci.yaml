name: EntryTracker CI Workflow

# הגדרת הטריגר (מתי ה-Workflow ירוץ)
on:
  push:
    branches:
      - main  # ה-Workflow ירוץ בכל פעם שתבצעי Push לענף הראשי
  pull_request:
    branches:
      - main

jobs:
  # הגדרת ה-Job הראשון: Build and Test
  build-and-test:
    runs-on: ubuntu-latest  # ה-Runner יריץ את המשימות על שרת אובונטו מעודכן

    steps:
      # שלב 4 - חלק 1: משיכת הקוד מה-Repository
      - name: Checkout Source Code
        uses: actions/checkout@v3  # פעולה מובנית של GitHub שמושכת את הקוד שלך ל-Runner

# שלב 4 - חלק 2: הגדרת סביבת Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

# שלב 4 - חלק 3: הרצת Unit Tests פשוטים בעזרת curl
      - name: Run Unit Test (curl)
        run: |
          # שליחת בקשת GET לכתובת המקומית בפורט 5000
          response=$(curl -s http://localhost:5000/)
          echo "Application response: $response"
          
          # בדיקה האם התשובה מכילה את המפתח הצפוי (למשל current_entry)
          if [[ $response == *"current_entry"* ]]; then
            echo "Unit test passed!"
          else
            echo "Unit test failed - expected key not found"
            exit 1
          fi

      # התקנת התלויות (Dependencies) מתוך requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # הרצת האפליקציה ברקע
      - name: Run application in background
        run: |
          python app.py &
          sleep 5  # המתנה של כמה שניות כדי לוודא שהאפליקציה עלתה לפני הבדיקות