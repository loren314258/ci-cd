name: EntryTracker CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run E2E Environment
        run: |
          docker-compose up -d --build
          # המתנה שה-MySQL יסיים לעלות (הוא לוקח זמן)
          sleep 30 

      - name: Run E2E Test (curl)
        run: |
          # בדיקה שהאפליקציה עונה ומצליחה לדבר עם ה-DB
          curl -v http://localhost:5000/

      - name: View Container Logs on Failure
        if: failure()
        run: |
          docker-compose logs

      - name: Cleanup
        if: always()
        run: docker-compose down